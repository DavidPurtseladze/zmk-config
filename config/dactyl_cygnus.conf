# Placeholder Kconfig overrides for the Dactyl Cygnus build.
# Populate once the shield is in place — common options for a Cygnus-style
# split board might include:

# Uncomment if/when running Bluetooth split between halves (see BUILD_NOTES.md §5)
# CONFIG_ZMK_BLE=y

# Uncomment to enable an OLED display, if the build includes one
# CONFIG_ZMK_DISPLAY=y
