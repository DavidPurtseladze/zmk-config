# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#   - board: nice_nano
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  - board: nice_nano_v2
    shield: lily58_left
  - board: nice_nano_v2
    shield: lily58_right
  - board: nice_nano_v2
    shield: dactyl_cygnus_left
  - board: nice_nano_v2
    shield: dactyl_cygnus_right
  # TEMPORARY hardware bring-up test: builds dactyl_cygnus_right as a
  # standalone, non-split keyboard (no left half / pairing needed) so it can
  # be tested alone over USB while the left board is being diagnosed. Pins
  # are still Corne placeholders, so this only proves the board + matrix
  # scanning work at all -- not that keys map to the right letters yet.
  # Remove this entry once both halves are confirmed good and wired for real.
  - board: nice_nano_v2
    shield: dactyl_cygnus_right
    cmake-args: -DCONFIG_ZMK_SPLIT=n
    artifact-name: dactyl_cygnus_right_standalone_test
