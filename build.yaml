# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#   - board: nice_nano
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  - board: nice_nano_v2
    shield: lily58_left
  - board: nice_nano_v2
    shield: lily58_right
  - board: nice_nano_v2
    shield: dactyl_cygnus_left
  - board: nice_nano_v2
    shield: dactyl_cygnus_right
  # TEMPORARY left-half bring-up: same left firmware, plus USB logging so
  # every physical key press is printed with its raw row/col over the USB
  # serial port -- including presses on matrix positions the keymap
  # doesn't use, which typing-based testing can't see. Remove once the
  # left thumb cluster is confirmed.
  - board: nice_nano_v2
    shield: dactyl_cygnus_left
    snippet: zmk-usb-logging
    artifact-name: dactyl_cygnus_left_debug_log
  # Flash to BOTH halves (then the normal firmware) to clear stale BLE
  # split pairing between the halves.
  - board: nice_nano_v2
    shield: settings_reset
